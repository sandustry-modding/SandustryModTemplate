name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Builds a mod that imports @modkit/ui/tailwind.css (metafile namespace paths).
      - name: Build Tailwind example
        run: npm run build -- --mod examples
      - name: npm run setup (Windows)
        if: runner.os == 'Windows'
        env:
          SANDUSTRY: ${{ github.workspace }}/.tmp/ci-sandustry/Sandustry.exe
        run: |
          node scripts/setup/prepare-ci-game.js
          npm run setup
